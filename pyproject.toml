[project]
name = "quantum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Shrestha", email = "ashrest6@terpmail.umd.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyqt6>=6.11.0",
    "pyzx>=0.10.7",
    "qiskit>=2.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
quantum = "quantum:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
